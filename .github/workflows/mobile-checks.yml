name: Mobile checks
on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile-checks.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile-checks.yml"]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
