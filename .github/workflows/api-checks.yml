name: API checks

on:
  push:
    paths:
      - "services/api/**"
      - ".github/workflows/api-checks.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5432/finance_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/api
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5432/finance_test
        run: python -m alembic upgrade head

      - name: Verify database schema
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://finance:finance@127.0.0.1:5432/finance_test
        run: python -m alembic check

      - name: Run backend tests
        working-directory: services/api
        run: python -m pytest tests -v --tb=short

      - name: Check Python lint
        working-directory: services/api
        run: python -m ruff check app tests migrations

      - name: Check Python formatting
        working-directory: services/api
        run: python -m ruff format --check app tests migrations
